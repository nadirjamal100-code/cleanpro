<section class="t" id="testimonials" (mouseenter)="pauseAutoplay()" (mouseleave)="resumeAutoplay()" (focusin)="pauseAutoplay()" (focusout)="onFocusOut($event)">
  <div class="container t__in">
    <div class="t__l">
      <h2>Feedback About Their Experience With Us</h2>
      <p>Read what our satisfied clients. See how our cleaning services have made a difference in their lives and homes</p>
      <div class="arrows">
        <button type="button" class="a" (click)="prev()" aria-label="Previous review"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 12H4m6-6-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button type="button" class="a a--on" (click)="next()" aria-label="Next review"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>
    @if (current(); as r) {
      <figure class="card" aria-live="polite">
        <img [src]="r.img" width="190" height="200" [alt]="r.name + ', ' + r.role" loading="lazy">
        <figcaption>
          <div class="who"><div><b>{{ r.name }}</b><span>{{ r.role }}</span>
            <div class="stars" role="img" aria-label="5 out of 5 stars">@for (s of stars; track s) { <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="#f5a623" d="m12 2 3 7 7.5.6-5.7 5 1.8 7.4L12 18l-6.6 4 1.8-7.4-5.7-5L9 9z"/></svg> }</div></div>
            <svg class="q" width="54" height="46" viewBox="0 0 54 46" aria-hidden="true"><rect width="54" height="46" rx="2" fill="#37b865"/><path fill="#fff" d="M19 8c-7 0-12 5-12 12 0 6 4 10 9 11-2 4-5 7-8 9l3 3c9-5 16-14 16-24 0-7-3-11-8-11zm23 0c-7 0-12 5-12 12 0 6 4 10 9 11-2 4-5 7-8 9l3 3c9-5 16-14 16-24 0-7-3-11-8-11z" transform="translate(1 0)"/></svg></div>
          <blockquote>{{ r.text }}</blockquote>
        </figcaption>
      </figure>
    }
  </div>
</section>
